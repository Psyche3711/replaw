            {"name":"国家外汇管理局综合司关于报送外汇指定银行反洗钱机构及人员情况的通知（汇综发〔2004〕52号）","category":"部门规章/规范性文件","year":2009,"abolish_date":"20090825","abolish_reason":"国家外汇管理局关于公布废止和失效的25件外汇管理规范性文件的通知（汇发〔2009〕36号）-附件1《废止的17件外汇管理规范性文件目录》"},
            {"name":"《人民币大额和可疑支付交易报告管理办法》（中国人民银行令〔2003〕第2号）和《金融机构大额和可疑外汇资金交易报告管理办法》（中国人民银行令〔2003〕第3号）","category":"部门规章/规范性文件","year":2007,"abolish_date":"20070301","abolish_reason":"金融机构大额交易和可疑交易报告管理办法（中国人民银行令〔2006〕第2号，该法规也已失效）"},
            {"name":"大额和可疑支付交易报告接收及调查操作程序（银办发〔2004〕180号）","category":"部门规章/规范性文件","year":2007,"abolish_date":"20070521","abolish_reason":"关于印发《中国人民银行反洗钱调查实施细则(试行)》的通知（银发〔2007〕158号）"},
            {"name":"中国人民银行办公厅关于进一步规范大额交易和可疑交易报告纠错删除操作规程的通知（银办发〔2014〕104号）","category":"部门规章/规范性文件","year":2005,"abolish_date":"20050321","abolish_reason":"中国人民银行公告〔2025〕第3号"},
            {"name":"银行账户管理办法（银发〔1994〕255号）","category":"部门规章/规范性文件","year":2003,"abolish_date":"20030901","abolish_reason":"人民币银行结算账户管理办法（中国人民银行令〔2003〕第5号）"},
            {"name":"证券公司反洗钱客户风险等级划分标准指引(试行)（中证协发〔2009〕110号）","category":"团体/行业规定","year":2014,"abolish_date":"20140428","abolish_reason":"中国证券业协会关于发布《证券公司反洗钱工作指引》的通知(中证协发〔2014〕72号)"},
            {"name":"中国证券业协会《会员反洗钱工作指引》","category":"团体/行业规定","year":2014,"abolish_date":"20140428","abolish_reason":"中国证券业协会关于发布《证券公司反洗钱工作指引》的通知(中证协发〔2014〕72号)"}
        ];
        
        let currentPage = 1;
        let itemsPerPage = 10;
        let filteredLaws = [...allLawsData];
        
        // 年份统计
        const yearStats = {
            "2026": 11, "2025": 14, "2024": 12, "2023": 7, "2022": 14, "2021": 3,
            "2020": 1, "2019": 2, "2018": 2, "2017": 3, "2016": 1, "2014": 3, "2012": 1,
            "2010": 2, "2009": 3, "2007": 2, "2005": 1, "2003": 1
        };
        
        // 初始化图表
        function initCharts() {
            // 按类型分布
            const typeCtx = document.getElementById('typesChart').getContext('2d');
            new Chart(typeCtx, {
                type: 'doughnut',
                data: {
                    labels: ['法律/司法解释', '行政法规', '部门规章/规范性文件', '团体/行业规定'],
                    datasets: [{
                        data: [4, 5, 74, 2],
                        backgroundColor: [
                            '#667eea',
                            '#764ba2',
                            '#f093fb',
                            '#4facfe'
                        ],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
            
            // 按年份分布
            const yearCtx = document.getElementById('yearsChart').getContext('2d');
            new Chart(yearCtx, {
                type: 'bar',
                data: {
                    labels: ['2026', '2025', '2024', '2023', '2022', '2021', '2020', '2019', '2018', '2017', '2016', '2014', '2012', '2010', '2009', '2007', '2005', '2003'],
                    datasets: [{
                        label: '废止数量',
                        data: [11, 14, 12, 7, 14, 3, 1, 2, 2, 3, 1, 3, 1, 2, 3, 2, 1, 1],
                        backgroundColor: '#667eea',
                        borderColor: '#667eea',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    scales: {
                        x: {
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
        
        // 显示法规列表
        function displayLaws(laws) {
            const lawsList = document.getElementById('lawsList');
            const totalPages = Math.ceil(laws.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = laws.slice(start, end);
            
            if (laws.length === 0) {
                lawsList.innerHTML = '<div class="no-results">未找到匹配的法规，请调整筛选条件</div>';
                document.getElementById('resultCount').textContent = '未找到相关法规';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            lawsList.innerHTML = pageItems.map(law => {
                const categoryClass = law.category === '法律/司法解释' ? 'badge-category-law' :
                                     law.category === '行政法规' ? 'badge-category-admin' :
                                     law.category === '团体/行业规定' ? 'badge-category-industry' : 'badge-category';
                return `
                <div class="law-item">
                    <div class="law-name">${law.name}</div>
                    <div class="law-meta">
                        <div class="law-meta-item">
                            <span class="badge ${categoryClass}">${law.category}</span>
                        </div>
                        ${law.year ? `
                        <div class="law-meta-item">
                            <span class="badge badge-year">${law.year}年废止</span>
                        </div>
                        ` : ''}
                        ${law.abolish_date ? `
                        <div class="law-meta-item">
                            <span class="law-meta-label">废止日期：</span>
                            <span>${formatDate(law.abolish_date)}</span>
                        </div>
                        ` : ''}
                    </div>
                    ${law.abolish_reason ? `
                    <div style="margin-top: 10px; font-size: 0.9em; color: #888;">
                        <strong>废止依据：</strong>${law.abolish_reason}
                    </div>
                    ` : ''}
                </div>
                `;
            }).join('');
            
            document.getElementById('resultCount').textContent = `显示 ${start + 1}-${Math.min(end, laws.length)} 条 / 共 ${laws.length} 条法规`;
            
            // 分页按钮
            let paginationHTML = '';
            if (currentPage > 1) {
                paginationHTML += `<button onclick="goToPage(${currentPage - 1})">上一页</button>`;
            }
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    paginationHTML += `<button class="active">${i}</button>`;
                } else {
                    paginationHTML += `<button onclick="goToPage(${i})">${i}</button>`;
                }
            }
            if (currentPage < totalPages) {
                paginationHTML += `<button onclick="goToPage(${currentPage + 1})">下一页</button>`;
            }
            document.getElementById('pagination').innerHTML = paginationHTML;
        }
        
        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr || dateStr.length !== 8) return dateStr;
            return `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
        }
        
        // 分页
        function goToPage(page) {
            currentPage = page;
            displayLaws(filteredLaws);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 筛选法规
        function filterLaws() {
            const year = document.getElementById('yearFilter').value;
            const type = document.getElementById('typeFilter').value;
            const keyword = document.getElementById('keywordFilter').value.toLowerCase();
            
            currentPage = 1;
            filteredLaws = allLawsData.filter(law => {
                let match = true;
                
                if (year && law.year != year) {
                    match = false;
                }
                
                if (type && law.category !== type) {
                    match = false;
                }
                
                if (keyword && !law.name.toLowerCase().includes(keyword) && 
                    (!law.abolish_reason || !law.abolish_reason.toLowerCase().includes(keyword))) {
                    match = false;
                }
                
                return match;
            });
            
            displayLaws(filteredLaws);
        }
        
        // 重置筛选
        function resetFilter() {
            document.getElementById('yearFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('keywordFilter').value = '';
            currentPage = 1;
            filteredLaws = [...allLawsData];
            displayLaws(filteredLaws);
        }
        
        // 回到顶部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 监听滚动事件
        window.addEventListener('scroll', function() {
            const scrollBtn = document.getElementById('scrollBtn');
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollBtn.style.display = 'block';
            } else {
                scrollBtn.style.display = 'none';
            }
        });
        
        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            displayLaws(filteredLaws);
        });
    </script>
</body>
</html>
