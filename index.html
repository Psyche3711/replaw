            const pageItems = laws.slice(start, end);
            
            if (laws.length === 0) {
                lawsList.innerHTML = '<div class="no-results">未找到匹配的法规，请调整筛选条件</div>';
                document.getElementById('resultCount').textContent = '未找到相关法规';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            lawsList.innerHTML = pageItems.map(law => {
                const categoryClass = law.category === '法律/司法解释' ? 'badge-category-law' : 
                                     law.category === '行政法规' ? 'badge-category-admin' : 'badge-category';
                return `
                <div class="law-item">
                    <div class="law-name">${law.name}</div>
                    <div class="law-meta">
                        <div class="law-meta-item">
                            <span class="badge ${categoryClass}">${law.category}</span>
                        </div>
                        ${law.year ? `
                        <div class="law-meta-item">
                            <span class="badge badge-year">${law.year}年废止</span>
                        </div>
                        ` : ''}
                        ${law.abolish_date ? `
                        <div class="law-meta-item">
                            <span class="law-meta-label">废止日期：</span>
                            <span>${formatDate(law.abolish_date)}</span>
                        </div>
                        ` : ''}
                    </div>
                    ${law.abolish_reason ? `
                    <div style="margin-top: 10px; font-size: 0.9em; color: #888;">
                        <strong>废止依据：</strong>${law.abolish_reason}
                    </div>
                    ` : ''}
                </div>
            `}.join('');
            
            document.getElementById('resultCount').textContent = `显示 ${start + 1}-${Math.min(end, laws.length)} 条 / 共 ${laws.length} 条法规`;
            
            // 分页按钮
            let paginationHTML = '';
            if (currentPage > 1) {
                paginationHTML += `<button onclick="goToPage(${currentPage - 1})">上一页</button>`;
            }
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    paginationHTML += `<button class="active">${i}</button>`;
                } else {
                    paginationHTML += `<button onclick="goToPage(${i})">${i}</button>`;
                }
            }
            if (currentPage < totalPages) {
                paginationHTML += `<button onclick="goToPage(${currentPage + 1})">下一页</button>`;
            }
            document.getElementById('pagination').innerHTML = paginationHTML;
        }
        
        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr || dateStr.length !== 8) return dateStr;
            return `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
        }
        
        // 分页
        function goToPage(page) {
            currentPage = page;
            displayLaws(filteredLaws);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 筛选法规
        function filterLaws() {
            const year = document.getElementById('yearFilter').value;
            const type = document.getElementById('typeFilter').value;
            const keyword = document.getElementById('keywordFilter').value.toLowerCase();
            
            currentPage = 1;
            filteredLaws = allLawsData.filter(law => {
                let match = true;
                
                if (year && law.year != year) {
                    match = false;
                }
                
                if (type && law.type !== type) {
                    match = false;
                }
                
                if (keyword && !law.name.toLowerCase().includes(keyword) && 
                    (!law.abolish_reason || !law.abolish_reason.toLowerCase().includes(keyword))) {
                    match = false;
                }
                
                return match;
            });
            
            displayLaws(filteredLaws);
        }
        
        // 重置筛选
        function resetFilter() {
            document.getElementById('yearFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('keywordFilter').value = '';
            currentPage = 1;
            filteredLaws = [...allLawsData];
            displayLaws(filteredLaws);
        }
        
        // 回到顶部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // 监听滚动事件
        window.addEventListener('scroll', function() {
            const scrollBtn = document.getElementById('scrollBtn');
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollBtn.style.display = 'block';
            } else {
                scrollBtn.style.display = 'none';
            }
        });
        
        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            displayLaws(filteredLaws);
        });
    </script>
</body>
</html>
